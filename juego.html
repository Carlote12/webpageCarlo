       </div>

            <img src="fotojuego.png" alt="imagenjuego" class="screenshotjuego">
       </div>
    </div>

       <div class="movimiento">
        <div class="volver">
            <a href="sumobot.html" class="boton-atras">
                <img src="flecha.png" alt="Flecha">
            </a>
        </div>
        <div class="siguiente">
            <a href="x">
                <img src="flecha derecha.png" alt="flecha">
